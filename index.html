<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFCE Questões</title>

  <script src="questions.js"></script>

<style>
body {
  background:#0b0b14;
  color:#fff;
  font-family:system-ui;
  margin:0;
  padding:15px;
}
h2, h3 { margin:10px 0; }
button {
  width:100%;
  padding:14px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  background:#1c1c2b;
  color:#fff;
  font-size:16px;
}
.correct { background:#0f5132; }
.wrong { background:#842029; }
.meta { font-size:14px; opacity:.9; }
hr { border:0; border-top:1px solid #333; margin:15px 0; }
</style>
</head>

<body>

<h3 id="category"></h3>
<h2 id="question"></h2>

<div id="options"></div>

<button onclick="next()">Próxima</button>

<hr>

<h3>📊 Estatísticas</h3>
<div id="stats"></div>

<h3>🎯 Metas</h3>
<div id="goals"></div>

<script>
/* =======================
   ESTADO DO APP
======================= */
let questions = [...QUESTIONS].sort(() => Math.random() - 0.5);
let index = 0;
let errors = [];
let stats = JSON.parse(localStorage.getItem("stats")) || {};
let goals = JSON.parse(localStorage.getItem("goals")) || {};

/* =======================
   METAS (30 exemplos)
======================= */
const GOALS = [
  { c:"Português", t:5 },
  { c:"Português", t:10 },
  { c:"Informática", t:5 },
  { c:"Informática", t:10 },
  { c:"Lei 8.112", t:5 },
  { c:"Lei 8.112", t:10 },
  { c:"Raciocínio Lógico", t:5 },
  { c:"Raciocínio Lógico", t:10 },
];

/* =======================
   FUNÇÕES
======================= */
function show() {
  const q = questions[index];
  document.getElementById("category").innerText = q.c;
  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("options");
  box.innerHTML = "";

  q.o.forEach((op,i)=>{
    const b = document.createElement("button");
    b.innerText = op;
    b.onclick = () => answer(i,b);
    box.appendChild(b);
  });

  updateStatsUI();
  updateGoalsUI();
}

function answer(i,btn) {
  const q = questions[index];
  const buttons = document.querySelectorAll("#options button");
  buttons.forEach(b=>b.disabled=true);

  stats[q.c] = stats[q.c] || { ok:0, total:0 };
  stats[q.c].total++;

  if(i === q.r){
    btn.classList.add("correct");
    stats[q.c].ok++;
  } else {
    btn.classList.add("wrong");
    buttons[q.r].classList.add("correct");
    errors.push(q);
  }

  localStorage.setItem("stats",JSON.stringify(stats));
}

function next() {
  index++;
  if(index < questions.length){
    show();
  } else if(errors.length){
    questions = [...errors];
    errors = [];
    index = 0;
    alert("🔁 Agora vamos repetir as que você errou!");
    show();
  } else {
    document.body.innerHTML = "<h1>🎉 Parabéns! Finalizado.</h1>";
    localStorage.clear();
  }
}

/* =======================
   UI
======================= */
function updateStatsUI(){
  const s = document.getElementById("stats");
  s.innerHTML = "";
  for(let c in stats){
    s.innerHTML += `<div class="meta">${c}: ${stats[c].ok}/${stats[c].total}</div>`;
  }
}

function updateGoalsUI(){
  const g = document.getElementById("goals");
  g.innerHTML = "";
  GOALS.forEach(m=>{
    const ok = stats[m.c]?.ok || 0;
    const done = ok >= m.t;
    g.innerHTML += `<div class="meta">${done ? "✅" : "⬜"} ${m.t} acertos em ${m.c}</div>`;
  });
}

show();
</script>

</body>
</html>
