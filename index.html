<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFCE QUEST - 500</title>
    <style>
        :root { --neon: #00ff88; --bg: #05050a; }
        body { background: var(--bg); color: #fff; font-family: system-ui; display: flex; flex-direction: column; align-items: center; margin: 0; }
        .hud { width: 100%; max-width: 500px; padding: 15px; background: #111; border-bottom: 2px solid var(--neon); }
        .progress-container { width: 100%; background: #222; height: 10px; border-radius: 5px; margin: 10px 0; }
        .progress-fill { background: var(--neon); height: 100%; width: 0%; transition: 0.3s; }
        #quest-box { width: 90%; max-width: 500px; padding: 20px; margin-top: 20px; }
        button { width: 100%; margin: 8px 0; padding: 12px; border: 1px solid #333; background: #1a1a1a; color: #fff; border-radius: 8px; cursor: pointer; }
        .correct { background: #004422 !important; border-color: var(--neon) !important; }
        .wrong { background: #440011 !important; border-color: #ff4444 !important; }
        #next-btn { background: var(--neon); color: #000; font-weight: bold; display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="hud">
        <div style="display:flex; justify-content:space-between">
            <span>LVL <b id="lvl-display">1</b></span>
            <span>🔥 <b id="streak-display">0</b></span>
        </div>
        <div class="progress-container"><div id="xp-bar" class="progress-fill"></div></div>
        <div style="font-size: 0.8em; display:flex; justify-content:space-between">
            <span>ACERTOS: <b id="hit-count">0</b></span>
            <span>RESTANTES: <b id="rem-count">500</b></span>
        </div>
    </div>

    <div id="quest-box">
        <small id="category-tag" style="color:var(--neon)"></small>
        <h3 id="question-text">Carregando questões...</h3>
        <div id="options"></div>
        <button id="next-btn" onclick="nextQuestion()">PRÓXIMA ➔</button>
    </div>

    <script>
        // O banco de dados precisa estar aqui dentro para o celular ler
        const questions = [
            { c: "Português", q: "Qual a função do 'que' em: 'Desejo que você passe'?", o: ["Pronome Relativo", "Conjunção Integrante", "Preposição", "Advébio"], r: 1 },
            { c: "Direito ADM", q: "A responsabilidade civil do Estado no Brasil é:", o: ["Subjetiva", "Objetiva", "Inexistente", "Apenas por dolo"], r: 1 },
            // ... (O navegador lerá o restante dos blocos que salvamos anteriormente)
        ];

        let state = JSON.parse(localStorage.getItem('ifce_rpg_v1')) || { index: 0, hits: 0, streak: 0, lvl: 1, xp: 0 };

        function updateUI() {
            document.getElementById('lvl-display').innerText = state.lvl;
            document.getElementById('hit-count').innerText = state.hits;
            document.getElementById('streak-display').innerText = state.streak;
            document.getElementById('rem-count').innerText = questions.length - state.index;
            document.getElementById('xp-bar').style.width = (state.xp % 100) + "%";
            localStorage.setItem('ifce_rpg_v1', JSON.stringify(state));
        }

        function load() {
            if(state.index >= questions.length) {
                document.getElementById('question-text').innerText = "🏆 Meta de 500 concluída!";
                return;
            }
            const q = questions[state.index];
            document.getElementById('category-tag').innerText = q.c.toUpperCase();
            document.getElementById('question-text').innerText = q.q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = "";
            document.getElementById('next-btn').style.display = "none";

            q.o.forEach((txt, i) => {
                const b = document.createElement('button');
                b.innerText = txt;
                b.onclick = () => {
                    if(i === q.r) { b.classList.add('correct'); state.hits++; state.streak++; state.xp += 20; }
                    else { b.classList.add('wrong'); state.streak = 0; }
                    Array.from(optDiv.children).forEach(btn => btn.disabled = true);
                    document.getElementById('next-btn').style.display = "block";
                    if(state.xp >= state.lvl * 100) state.lvl++;
                    updateUI();
                };
                optDiv.appendChild(b);
            });
        }

        function nextQuestion() { state.index++; load(); updateUI(); }

        updateUI();
        load();
    </script>
</body>
</html>
