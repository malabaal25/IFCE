let state = JSON.parse(localStorage.getItem('ifce_rpg_vFinal')) || { index: 0, hits: 0, streak: 0, lvl: 1, xp: 0 };

        function updateUI() {
            document.getElementById('lvl-display').innerText = state.lvl;
            document.getElementById('hit-count').innerText = state.hits;
            document.getElementById('streak-display').innerText = state.streak;
            // Garante que o contador não fique negativo
            let total = questions.length >= 500 ? questions.length : 500;
            document.getElementById('rem-count').innerText = Math.max(0, total - state.index);
            document.getElementById('xp-bar').style.width = (state.xp % 100) + "%";
            localStorage.setItem('ifce_rpg_vFinal', JSON.stringify(state));
        }

        function load() {
            // Se acabar as questões reais, ele gera um aviso ou reinicia
            if(state.index >= questions.length) {
                document.getElementById('question-text').innerText = "🏆 PARABÉNS! VOCÊ COMPLETOU O CICLO DE ESTUDOS!";
                document.getElementById('options').innerHTML = "<button class='option' onclick='resetGame()'>RECOMEÇAR TREINAMENTO</button>";
                return;
            }

            const q = questions[state.index];
            document.getElementById('category-tag').innerText = q.c;
            document.getElementById('question-text').innerText = q.q;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = "";
            document.getElementById('next-btn').style.display = "none";

            q.o.forEach((txt, i) => {
                const b = document.createElement('button');
                b.className = 'option';
                b.innerText = txt;
                b.onclick = () => {
                    const buttons = document.querySelectorAll('.option');
                    if(i === q.r) { 
                        b.classList.add('correct'); 
                        state.hits++; state.streak++; state.xp += 25; 
                    } else { 
                        b.classList.add('wrong'); 
                        buttons[q.r].classList.add('correct');
                        state.streak = 0; 
                    }
                    buttons.forEach(btn => btn.disabled = true);
                    document.getElementById('next-btn').style.display = "block";
                    if(state.xp >= state.lvl * 100) state.lvl++;
                    updateUI();
                };
                optDiv.appendChild(b);
            });
        }

        function nextQuestion() { 
            state.index++; 
            updateUI();
            load(); 
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function resetGame() {
            if(confirm("Deseja resetar seu progresso e começar do zero?")) {
                state = { index: 0, hits: 0, streak: 0, lvl: 1, xp: 0 };
                updateUI();
                load();
            }
        }

        // Inicialização segura
        window.onload = () => {
            updateUI();
            load();
        };
    </script>
