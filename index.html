<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFCE Questões</title>

<style>
body {
  background:#05050a;
  color:#fff;
  font-family:system-ui;
  text-align:center;
  margin:0;
}
button {
  width:90%;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  border:none;
  background:#151515;
  color:#fff;
}
.correct { background:#004422; }
.wrong { background:#440011; }
</style>
</head>

<body>

<h3 id="category">Carregando…</h3>
<h2 id="question">Aguarde…</h2>
<div id="options"></div>
<button onclick="next()">Próxima</button>

<script src="questions.js"></script>
<script>
let i = 0;

function show() {
  const q = QUESTIONS[i];
  document.getElementById("category").innerText = q.c;
  document.getElementById("question").innerText = q.q;

  const box = document.getElementById("options");
  box.innerHTML = "";

  q.o.forEach((op, n) => {
    const b = document.createElement("button");
    b.innerText = op;
    b.onclick = () => check(n, b);
    box.appendChild(b);
  });
}

function check(n, btn) {
  const q = QUESTIONS[i];
  const btns = document.querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  btn.classList.add(n === q.r ? "correct" : "wrong");
}

function next() {
  i++;
  if (i < QUESTIONS.length) show();
  else document.body.innerHTML = "<h1>🎉 Finalizado!</h1>";
}

show();
</script>

</body>
</html>
